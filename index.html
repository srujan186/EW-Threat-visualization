<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Radar Display - Su-30 (Multi-Threat)</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Courier New', monospace;
            background: #0a0e27;
            color: #00ff00;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            display: flex;
            gap: 30px;
            max-width: 1400px;
            width: 100%;
        }

        .radar-container {
            background: #0d1124;
            border: 2px solid #1a3a52;
            border-radius: 10px;
            padding: 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .radar-title {
            color: #00ddff;
            font-size: 24px;
            margin-bottom: 20px;
            text-align: center;
            letter-spacing: 2px;
        }

        canvas {
            background: #050814;
            border: 2px solid #1a3a52;
            border-radius: 5px;
            box-shadow: 0 0 20px rgba(0, 100, 150, 0.3);
            cursor: crosshair;
        }

        .controls {
            background: #0d1124;
            border: 2px solid #1a3a52;
            border-radius: 10px;
            padding: 30px;
            width: 400px;
            height: fit-content;
            max-height: 90vh;
            overflow-y: auto;
        }

        .controls::-webkit-scrollbar { width: 8px; }
        .controls::-webkit-scrollbar-track { background: #050814; border-radius: 4px; }
        .controls::-webkit-scrollbar-thumb { background: #1a3a52; border-radius: 4px; }
        .controls::-webkit-scrollbar-thumb:hover { background: #00ddff; }

        .control-group { margin-bottom: 20px; }
        .control-group label {
            display: block;
            color: #00ddff;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: bold;
        }

        select, input[type="number"] {
            width: 100%;
            padding: 10px;
            background: #050814;
            border: 2px solid #1a3a52;
            color: #00ff00;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            border-radius: 5px;
            cursor: pointer;
        }

        select:focus, input:focus { outline: none; border-color: #00ddff; }

        .info-display {
            background: #050814;
            border: 2px solid #1a3a52;
            border-radius: 5px;
            padding: 15px;
            margin-top: 20px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 13px;
        }

        .info-label { color: #888; }
        .info-value { color: #00ff00; font-weight: bold; }

        .legend {
            background: #050814;
            border: 2px solid #1a3a52;
            border-radius: 5px;
            padding: 15px;
            margin-top: 20px;
        }

        .legend-title { color: #00ddff; margin-bottom: 10px; font-weight: bold; }

        .legend-item {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
            font-size: 12px;
        }

        .legend-symbol {
            width: 30px;
            height: 15px;
            margin-right: 10px;
            border-radius: 2px;
        }

        .controls-title {
            color: #00ddff;
            font-size: 20px;
            margin-bottom: 20px;
            text-align: center;
            letter-spacing: 2px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #1a3a52;
            border: 2px solid #00ddff;
            color: #00ddff;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.3s;
        }

        button:hover { background: #00ddff; color: #0d1124; }
        #clearButton:hover { background: #ff4444 !important; color: #fff !important; }
        #clearMissilesBtn:hover { background: #ff8800 !important; color: #fff !important; }

        .sweep-toggle { margin-top: 15px; }

        /* Threat panels */
        .threat-item {
            background: #050814;
            border: 2px solid #1a3a52;
            border-radius: 5px;
            margin-bottom: 15px;
            overflow: hidden;
        }

        .threat-header {
            padding: 12px 15px;
            background: #0d1124;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            user-select: none;
        }

        .threat-header:hover { background: #1a2542; }
        .threat-header.active { background: #1a3a52; }

        .threat-title { color: #00ddff; font-weight: bold; font-size: 13px; }

        .threat-toggle {
            color: #00ff00;
            font-size: 18px;
            transition: transform 0.3s;
        }

        .threat-toggle.open { transform: rotate(180deg); }

        .threat-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out;
            padding: 0 15px;
        }

        .threat-content.open {
            max-height: 500px;
            padding: 15px;
            transition: max-height 0.4s ease-in;
        }

        .threat-content .control-group { margin-bottom: 15px; }
        .threat-content .control-group label { font-size: 12px; color: #888; }
        .threat-content input, .threat-content select { font-size: 12px; padding: 8px; }

        .threats-section {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid #1a3a52;
        }

        .section-title { color: #00ddff; font-size: 16px; margin-bottom: 15px; font-weight: bold; }

        .threat-color-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
        }

        /* Missile section */
        .missile-section {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid #ff4400;
        }

        .missile-section .section-title { color: #ff6600; }

        .missile-item {
            background: #050814;
            border: 2px solid #ff4400;
            border-radius: 5px;
            margin-bottom: 12px;
            overflow: hidden;
        }

        .missile-header {
            padding: 10px 15px;
            background: #1a0800;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            user-select: none;
        }

        .missile-header:hover { background: #2a1200; }

        .missile-title { color: #ff6600; font-weight: bold; font-size: 13px; }

        .missile-toggle {
            color: #ff6600;
            font-size: 18px;
            transition: transform 0.3s;
        }

        .missile-toggle.open { transform: rotate(180deg); }

        .missile-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out;
            padding: 0 15px;
        }

        .missile-content.open {
            max-height: 400px;
            padding: 15px;
            transition: max-height 0.4s ease-in;
        }

        .missile-content .control-group { margin-bottom: 12px; }
        .missile-content .control-group label { font-size: 12px; color: #ff8844; }
        .missile-content input { font-size: 12px; padding: 8px; border-color: #ff4400; }
        .missile-content input:focus { border-color: #ff8800; }

        .missile-status {
            font-size: 11px;
            padding: 4px 8px;
            border-radius: 3px;
            font-weight: bold;
        }

        .status-active { background: #002200; color: #00ff00; border: 1px solid #00ff00; }
        .status-done   { background: #220000; color: #ff4444; border: 1px solid #ff4444; }
        .status-idle   { background: #111122; color: #888888; border: 1px solid #444; }

        .row2 { display: flex; gap: 8px; }
        .row2 .control-group { flex: 1; }

        .launch-btn {
            width: 100%;
            padding: 8px;
            background: #8b0000;
            border: 2px solid #ff4400;
            color: #ff8800;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 5px;
            transition: all 0.3s;
        }

        .launch-btn:hover { background: #ff4400; color: #fff; }
        .launch-btn.launched { background: #003300; border-color: #00ff00; color: #00ff00; }
    </style>
</head>
<body>
<div class="container">
    <div class="radar-container">
        <div class="radar-title">EW THREAT DISPLAY — SU-30MKI</div>
        <canvas id="radarCanvas" width="700" height="700"></canvas>
    </div>

    <div class="controls">
        <div class="controls-title">EMITTER PARAMETERS</div>

        <div class="control-group">
            <label>THREAT TYPE</label>
            <select id="threatType">
                <option value="search">Search (□)</option>
                <option value="track">Track (△)</option>
                <option value="trackWhileScan">Track While Scan (◇)</option>
                <option value="acquisition">Acquisition (✱)</option>
                <option value="missile">Missile (⊕)</option>
                <option value="unknown">Unknown (#)</option>
            </select>
        </div>

        <div class="control-group">
            <label>NUMBER OF THREATS (1–16)</label>
            <input type="number" id="numThreats" min="1" max="16" value="1" step="1">
        </div>

        <div class="control-group sweep-toggle">
            <button id="sweepToggle">START SWEEP</button>
        </div>

        <div class="control-group">
            <button id="clearButton" style="background:#8b0000;border-color:#ff4444;">CLEAR ALL THREATS</button>
        </div>

        <div class="info-display">
            <div class="info-row">
                <span class="info-label">Active Threat Type:</span>
                <span class="info-value" id="activeThreat">SEARCH</span>
            </div>
            <div class="info-row">
                <span class="info-label">Active Threats:</span>
                <span class="info-value" id="activeThreatsCount">1</span>
            </div>
            <div class="info-row">
                <span class="info-label">Active Missiles:</span>
                <span class="info-value" id="activeMissilesCount">0</span>
            </div>
            <div class="info-row">
                <span class="info-label">Aircraft:</span>
                <span class="info-value">Su-30MKI</span>
            </div>
        </div>

        <!-- Threat panels -->
        <div class="threats-section">
            <div class="section-title">THREAT CONFIGURATIONS</div>
            <div id="threatsContainer"></div>
        </div>

        <!-- ═══════════════ MISSILE SECTION ═══════════════ -->
        <div class="missile-section">
            <div class="section-title">🚀 MISSILE TRACKS</div>

            <div class="control-group">
                <label>NUMBER OF MISSILES (1–8)</label>
                <input type="number" id="numMissiles" min="1" max="8" value="1" step="1">
            </div>

            <button id="clearMissilesBtn" style="background:#4a2000;border-color:#ff8800;color:#ff8800;">
                CLEAR ALL MISSILES
            </button>

            <div id="missilesContainer" style="margin-top:15px;"></div>
        </div>

        <div class="legend">
            <div class="legend-title">INDICATORS</div>
            <div class="legend-item">
                <div class="legend-symbol" style="background:rgba(0,255,0,0.3);border:1px solid #00ff00;"></div>
                <span>LHPD (Left)</span>
            </div>
            <div class="legend-item">
                <div class="legend-symbol" style="background:rgba(100,200,255,0.3);border:1px solid #64c8ff;"></div>
                <span>RHPD (Right)</span>
            </div>
            <div class="legend-item">
                <div class="legend-symbol" style="background:rgba(255,100,0,0.4);border:1px solid #ff6600;"></div>
                <span>Missile Track</span>
            </div>
            <div style="margin-top:12px;font-size:11px;color:#888;">
                □ Search | △ Track | ◇ TWS<br>
                ✱ Acquisition | ⊕ Missile | # Unknown
            </div>
        </div>
    </div>
</div>

<script>
const canvas = document.getElementById('radarCanvas');
const ctx    = canvas.getContext('2d');
const CX = canvas.width  / 2;
const CY = canvas.height / 2;
const MAX_R = 300;
const MAX_KM = 200;
const PX_PER_KM = MAX_R / MAX_KM;

/* ─── helpers ─── */
const deg2rad = d => d * Math.PI / 180;
const kmToPx  = km => km * PX_PER_KM;

function polarToXY(angleDeg, km) {
    const r = kmToPx(km);
    const a = deg2rad(angleDeg - 90);
    return { x: CX + Math.cos(a) * r, y: CY + Math.sin(a) * r };
}

/* ─── colours ─── */
const THREAT_COLORS = [
    '#ff0000','#00ff00','#ffff00','#ff00ff','#00ffff','#ff8800',
    '#0088ff','#88ff00','#ff0088','#8800ff','#ff8888','#88ff88',
    '#ffff88','#ff88ff','#88ffff','#ffffff'
];

const MISSILE_COLORS = ['#ff6600','#ff00ff','#00ffff','#ffff00','#ff4444','#44ff44','#4444ff','#ffffff'];

/* ─── state ─── */
let radarState = {
    threatType : 'search',
    numThreats : 1,
    sweepAngle : 0,
    sweepActive: false,
    threats    : [],
    missiles   : []   // [{id, startAngle, startRange, endAngle, endRange, speed, progress, active, color, trail}]
};

const threatPresets = {
    search        : { direction:0, angle:30,  range:40,  pages:2 },
    track         : { direction:0, angle:20,  range:60,  pages:1 },
    trackWhileScan: { direction:0, angle:10,  range:40,  pages:1 },
    acquisition   : { direction:0, angle:55,  range:40,  pages:2 },
    missile       : { direction:0, angle:10,  range:20,  pages:1 },
    unknown       : { direction:0, angle:180, range:20,  pages:1 }
};

/* ══════════════════════════════════════
   THREAT logic
══════════════════════════════════════ */
function initializeThreats() {
    radarState.threats = [];
    const preset = threatPresets[radarState.threatType];
    for (let i = 0; i < radarState.numThreats; i++) {
        const angle = (360 / radarState.numThreats) * i;
        radarState.threats.push({
            id: i + 1,
            scanDirection: angle,
            scanAngle    : preset.angle,
            range        : preset.range,
            numPages     : preset.pages,
            color        : THREAT_COLORS[i % THREAT_COLORS.length]
        });
    }
}

function createThreatsUI() {
    const c = document.getElementById('threatsContainer');
    c.innerHTML = '';
    radarState.threats.forEach((threat, i) => {
        const isOpen = i === 0;
        const div = document.createElement('div');
        div.className = 'threat-item';
        div.innerHTML = `
            <div class="threat-header" onclick="toggleThreat(${i})">
                <div>
                    <span class="threat-color-indicator" style="background:${threat.color};"></span>
                    <span class="threat-title">Threat ${threat.id} — ${radarState.threatType.toUpperCase()}</span>
                </div>
                <span class="threat-toggle ${isOpen?'open':''}">▼</span>
            </div>
            <div class="threat-content ${isOpen?'open':''}" id="tc-${i}">
                <div class="control-group">
                    <label>SCAN DIRECTION (°)</label>
                    <input type="number" min="-180" max="180" value="${threat.scanDirection}" step="1"
                           onchange="updateThreat(${i},'scanDirection',this.value)">
                </div>
                <div class="control-group">
                    <label>SCAN ANGLE (±°)</label>
                    <input type="number" min="0" max="180" value="${threat.scanAngle}" step="1"
                           onchange="updateThreat(${i},'scanAngle',this.value)">
                </div>
                <div class="control-group">
                    <label>RANGE (km)</label>
                    <input type="number" min="20" max="200" value="${threat.range}" step="20"
                           onchange="updateThreat(${i},'range',this.value)">
                </div>
                <div class="control-group">
                    <label>NUMBER OF PAGES</label>
                    <input type="number" min="1" max="10" value="${threat.numPages}" step="1"
                           onchange="updateThreat(${i},'numPages',this.value)">
                </div>
            </div>`;
        c.appendChild(div);
    });
}

window.toggleThreat = function(i) {
    const content = document.getElementById(`tc-${i}`);
    const toggle  = content.previousElementSibling.querySelector('.threat-toggle');
    content.classList.toggle('open');
    toggle .classList.toggle('open');
    content.previousElementSibling.classList.toggle('active');
};

window.updateThreat = function(i, field, val) {
    radarState.threats[i][field] = parseFloat(val);
};

/* ══════════════════════════════════════
   MISSILE logic
══════════════════════════════════════ */
function initializeMissiles(n) {
    // Keep existing missiles, just add or trim
    while (radarState.missiles.length < n) {
        const id = radarState.missiles.length + 1;
        radarState.missiles.push({
            id,
            startAngle : 0,
            startRange : 20,
            endAngle   : 90,
            endRange   : 100,
            speed      : 2,        // km/s equivalent (animation units)
            progress   : 0,        // 0 → 1
            active     : false,
            color      : MISSILE_COLORS[(id - 1) % MISSILE_COLORS.length],
            trail      : []        // last N positions
        });
    }
    radarState.missiles = radarState.missiles.slice(0, n);
}

function createMissilesUI() {
    const c = document.getElementById('missilesContainer');
    c.innerHTML = '';
    radarState.missiles.forEach((m, i) => {
        const div = document.createElement('div');
        div.className = 'missile-item';
        div.id = `mi-${i}`;
        div.innerHTML = `
            <div class="missile-header" onclick="toggleMissile(${i})">
                <div style="display:flex;align-items:center;gap:8px;">
                    <span style="width:10px;height:10px;border-radius:50%;background:${m.color};display:inline-block;"></span>
                    <span class="missile-title">Missile M${m.id}</span>
                </div>
                <div style="display:flex;align-items:center;gap:8px;">
                    <span class="missile-status status-idle" id="mstatus-${i}">IDLE</span>
                    <span class="missile-toggle">▼</span>
                </div>
            </div>
            <div class="missile-content" id="mc-${i}">
                <div class="row2">
                    <div class="control-group">
                        <label>START ANGLE (°)</label>
                        <input type="number" min="-180" max="180" value="${m.startAngle}" step="1"
                               oninput="updateMissile(${i},'startAngle',this.value)">
                    </div>
                    <div class="control-group">
                        <label>START RANGE (km)</label>
                        <input type="number" min="20" max="200" value="${m.startRange}" step="20"
                               oninput="updateMissile(${i},'startRange',this.value)">
                    </div>
                </div>
                <div class="row2">
                    <div class="control-group">
                        <label>END ANGLE (°)</label>
                        <input type="number" min="-180" max="180" value="${m.endAngle}" step="1"
                               oninput="updateMissile(${i},'endAngle',this.value)">
                    </div>
                    <div class="control-group">
                        <label>END RANGE (km)</label>
                        <input type="number" min="20" max="200" value="${m.endRange}" step="20"
                               oninput="updateMissile(${i},'endRange',this.value)">
                    </div>
                </div>
                <div class="control-group">
                    <label>SPEED (1=slow → 10=fast)</label>
                    <input type="number" min="1" max="10" value="${m.speed}" step="1"
                           oninput="updateMissile(${i},'speed',this.value)">
                </div>
                <button class="launch-btn" id="launchBtn-${i}" onclick="launchMissile(${i})">
                    🚀 LAUNCH MISSILE M${m.id}
                </button>
            </div>`;
        c.appendChild(div);
    });
}

window.toggleMissile = function(i) {
    const content = document.getElementById(`mc-${i}`);
    const toggle  = content.previousElementSibling.querySelector('.missile-toggle');
    content.classList.toggle('open');
    toggle .classList.toggle('open');
};

window.updateMissile = function(i, field, val) {
    radarState.missiles[i][field] = parseFloat(val);
    // If not launched yet, reset progress
    if (!radarState.missiles[i].active) {
        radarState.missiles[i].progress = 0;
        radarState.missiles[i].trail    = [];
    }
};

window.launchMissile = function(i) {
    const m = radarState.missiles[i];
    m.progress = 0;
    m.trail    = [];
    m.active   = true;

    const btn = document.getElementById(`launchBtn-${i}`);
    btn.textContent = '✅ LAUNCHED';
    btn.classList.add('launched');

    setMissileStatus(i, 'active');
    updateDisplay();
};

function setMissileStatus(i, state) {
    const el = document.getElementById(`mstatus-${i}`);
    if (!el) return;
    el.className = 'missile-status';
    if (state === 'active') { el.classList.add('status-active'); el.textContent = 'ACTIVE'; }
    else if (state === 'done') { el.classList.add('status-done');   el.textContent = 'DONE';   }
    else                       { el.classList.add('status-idle');   el.textContent = 'IDLE';   }
}

/* ── missile animation tick ── */
function updateMissiles() {
    radarState.missiles.forEach((m, i) => {
        if (!m.active) return;

        const speedFactor = m.speed * 0.003; // tune overall pace
        m.progress = Math.min(1, m.progress + speedFactor);

        // interpolate angle & range
        const angle = m.startAngle + (m.endAngle - m.startAngle) * m.progress;
        const range = m.startRange + (m.endRange - m.startRange) * m.progress;
        const pos   = polarToXY(angle, range);

        m.trail.push({ x: pos.x, y: pos.y });
        if (m.trail.length > 40) m.trail.shift();

        if (m.progress >= 1) {
            m.active = false;
            setMissileStatus(i, 'done');
            // re-enable launch button
            const btn = document.getElementById(`launchBtn-${i}`);
            if (btn) { btn.textContent = `🔄 RELAUNCH M${m.id}`; btn.classList.remove('launched'); }
            updateDisplay();
        }
    });
}

/* ── draw missile on canvas ── */
function drawMissile(m) {
    if (m.progress <= 0 || m.trail.length === 0) return;

    // Draw trail
    if (m.trail.length > 1) {
        for (let j = 1; j < m.trail.length; j++) {
            const alpha = j / m.trail.length;
            ctx.strokeStyle = hexToRgba(m.color, alpha * 0.7);
            ctx.lineWidth   = 1.5;
            ctx.beginPath();
            ctx.moveTo(m.trail[j-1].x, m.trail[j-1].y);
            ctx.lineTo(m.trail[j  ].x, m.trail[j  ].y);
            ctx.stroke();
        }
    }

    // Current position
    const pos = m.trail[m.trail.length - 1];

    // Glow
    const grd = ctx.createRadialGradient(pos.x, pos.y, 0, pos.x, pos.y, 12);
    grd.addColorStop(0, hexToRgba(m.color, 0.9));
    grd.addColorStop(1, hexToRgba(m.color, 0));
    ctx.fillStyle = grd;
    ctx.beginPath();
    ctx.arc(pos.x, pos.y, 12, 0, Math.PI * 2);
    ctx.fill();

    // Dot
    ctx.fillStyle = m.color;
    ctx.beginPath();
    ctx.arc(pos.x, pos.y, 4, 0, Math.PI * 2);
    ctx.fill();

    // Label
    ctx.fillStyle = m.color;
    ctx.font = 'bold 11px Courier New';
    ctx.fillText(`M${m.id}`, pos.x + 8, pos.y - 6);

    // Start & end markers
    if (m.progress < 1) {
        const start = polarToXY(m.startAngle, m.startRange);
        const end   = polarToXY(m.endAngle,   m.endRange);

        ctx.strokeStyle = hexToRgba(m.color, 0.5);
        ctx.lineWidth   = 1;
        ctx.setLineDash([4, 4]);
        ctx.beginPath();
        ctx.moveTo(start.x, start.y);
        ctx.lineTo(end.x,   end.y);
        ctx.stroke();
        ctx.setLineDash([]);

        // End target circle
        ctx.strokeStyle = m.color;
        ctx.lineWidth   = 1.5;
        ctx.beginPath();
        ctx.arc(end.x, end.y, 8, 0, Math.PI * 2);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(end.x - 12, end.y);
        ctx.lineTo(end.x + 12, end.y);
        ctx.moveTo(end.x, end.y - 12);
        ctx.lineTo(end.x, end.y + 12);
        ctx.stroke();
    }
}

function hexToRgba(hex, alpha) {
    const r = parseInt(hex.slice(1,3), 16);
    const g = parseInt(hex.slice(3,5), 16);
    const b = parseInt(hex.slice(5,7), 16);
    return `rgba(${r},${g},${b},${alpha})`;
}

/* ══════════════════════════════════════
   DRAW RADAR
══════════════════════════════════════ */
function drawRadar() {
    ctx.fillStyle = '#050814';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Background halves
    ctx.fillStyle = 'rgba(0,255,0,0.08)';
    ctx.beginPath();
    ctx.moveTo(CX, CY);
    ctx.arc(CX, CY, MAX_R, deg2rad(45-90), deg2rad(225-90));
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = 'rgba(100,200,255,0.08)';
    ctx.beginPath();
    ctx.moveTo(CX, CY);
    ctx.arc(CX, CY, MAX_R, deg2rad(225-90), deg2rad(45-90+360));
    ctx.closePath();
    ctx.fill();

    // Dividing dashed lines
    ctx.strokeStyle = 'rgba(150,150,150,0.3)';
    ctx.lineWidth   = 1.5;
    ctx.setLineDash([5,5]);
    [[45],[225]].forEach(([a]) => {
        const rad = deg2rad(a - 90);
        ctx.beginPath();
        ctx.moveTo(CX, CY);
        ctx.lineTo(CX + Math.cos(rad)*MAX_R, CY + Math.sin(rad)*MAX_R);
        ctx.stroke();
    });
    ctx.setLineDash([]);

    // Range rings (20 km each = label 1,2,3…10)
    for (let i = 1; i <= 10; i++) {
        const km  = i * 20;
        const r   = kmToPx(km);
        ctx.strokeStyle = '#1a3a52';
        ctx.lineWidth   = 1;
        ctx.beginPath();
        ctx.arc(CX, CY, r, 0, Math.PI*2);
        ctx.stroke();
        ctx.fillStyle = '#4a6a82';
        ctx.font      = '11px Courier New';
        ctx.fillText(i, CX + 5, CY - r + 5);
    }

    // Direction lines + labels
    const dirs = [
        [0,   '0°',    {dx:0,  dy:-18}],
        [45,  '45°',   {dx:5,  dy:-10}],
        [90,  '90°',   {dx:10, dy:5  }],
        [135, '135°',  {dx:5,  dy:15 }],
        [180, '±180°', {dx:-20,dy:20 }],
        [-135,'-135°', {dx:-38,dy:15 }],
        [-90, '-90°',  {dx:-38,dy:5  }],
        [-45, '-45°',  {dx:-38,dy:-10}],
    ];

    ctx.strokeStyle = '#1a3a52';
    ctx.lineWidth   = 1;
    ctx.fillStyle   = '#00ddff';
    ctx.font        = 'bold 13px Courier New';

    dirs.forEach(([deg, label, off]) => {
        const a = deg2rad(deg - 90);
        ctx.beginPath();
        ctx.moveTo(CX, CY);
        ctx.lineTo(CX + Math.cos(a)*MAX_R, CY + Math.sin(a)*MAX_R);
        ctx.stroke();
        ctx.fillText(label,
            CX + Math.cos(a)*(MAX_R + 10) + off.dx,
            CY + Math.sin(a)*(MAX_R + 10) + off.dy);
    });

    // Threat sectors
    radarState.threats.forEach(t => drawThreatSector(t));

    // Missiles
    updateMissiles();
    radarState.missiles.forEach(m => drawMissile(m));

    // Sweep
    if (radarState.sweepActive) drawSweepLine();

    // Aircraft
    drawAircraft();

    // Threat symbols
    radarState.threats.forEach(t => drawThreatSymbol(t));
}

/* ─── threat sector ─── */
function drawThreatSector(threat) {
    const selR   = kmToPx(threat.range);
    const sA     = deg2rad(threat.scanDirection - threat.scanAngle - 90);
    const eA     = deg2rad(threat.scanDirection + threat.scanAngle - 90);
    const {r, g, b} = hexRGB(threat.color);

    ctx.fillStyle   = `rgba(${r},${g},${b},0.08)`;
    ctx.strokeStyle = threat.color;
    ctx.lineWidth   = 1.5;
    ctx.beginPath();
    ctx.moveTo(CX, CY);
    ctx.arc(CX, CY, selR, sA, eA);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    ctx.strokeStyle = threat.color;
    ctx.lineWidth   = 2;
    ctx.setLineDash([5,5]);
    ctx.beginPath();
    ctx.arc(CX, CY, selR, sA, eA);
    ctx.stroke();
    ctx.setLineDash([]);

    if (threat.numPages > 1) {
        ctx.strokeStyle = `rgba(${r},${g},${b},0.3)`;
        ctx.lineWidth   = 1;
        ctx.setLineDash([3,3]);
        for (let p = 1; p < threat.numPages; p++) {
            const pr = selR * (p / threat.numPages);
            ctx.beginPath(); ctx.arc(CX, CY, pr, sA, eA); ctx.stroke();
        }
        ctx.setLineDash([]);
    }

    // Boundary lines
    ctx.strokeStyle = threat.color;
    ctx.lineWidth   = 2;
    [threat.scanDirection - threat.scanAngle, threat.scanDirection + threat.scanAngle].forEach(a => {
        const rad = deg2rad(a - 90);
        ctx.beginPath();
        ctx.moveTo(CX, CY);
        ctx.lineTo(CX + Math.cos(rad)*selR, CY + Math.sin(rad)*selR);
        ctx.stroke();
    });

    // Center dashed line
    const ca = deg2rad(threat.scanDirection - 90);
    ctx.strokeStyle = threat.color;
    ctx.lineWidth   = 1.5;
    ctx.setLineDash([8,4]);
    ctx.beginPath();
    ctx.moveTo(CX, CY);
    ctx.lineTo(CX + Math.cos(ca)*selR*0.7, CY + Math.sin(ca)*selR*0.7);
    ctx.stroke();
    ctx.setLineDash([]);
}

/* ─── sweep line ─── */
function drawSweepLine() {
    radarState.sweepAngle = (radarState.sweepAngle + 1) % 360;
    const a   = deg2rad(radarState.sweepAngle - 90);
    const grd = ctx.createLinearGradient(CX, CY,
        CX + Math.cos(a)*MAX_R, CY + Math.sin(a)*MAX_R);
    grd.addColorStop(0, 'rgba(0,200,255,0.8)');
    grd.addColorStop(1, 'rgba(0,200,255,0)');
    ctx.strokeStyle = grd;
    ctx.lineWidth   = 2;
    ctx.beginPath();
    ctx.moveTo(CX, CY);
    ctx.lineTo(CX + Math.cos(a)*MAX_R, CY + Math.sin(a)*MAX_R);
    ctx.stroke();
}

/* ─── aircraft (Su-30) ─── */
function drawAircraft() {
    ctx.save();
    ctx.translate(CX, CY);

    // Fuselage
    ctx.fillStyle   = '#00ddff';
    ctx.strokeStyle = '#00ffff';
    ctx.lineWidth   = 1.5;
    ctx.beginPath();
    ctx.moveTo(0, -22);
    ctx.lineTo(-3, 12);
    ctx.lineTo(3, 12);
    ctx.closePath();
    ctx.fill(); ctx.stroke();

    // Wings
    ctx.beginPath();
    ctx.moveTo(-18, 0);
    ctx.lineTo(18, 0);
    ctx.lineTo(14, 7);
    ctx.lineTo(-14, 7);
    ctx.closePath();
    ctx.fill(); ctx.stroke();

    // Tail fins
    [[-7,9,-10,18,-4,18],[7,9,10,18,4,18]].forEach(([x1,y1,x2,y2,x3,y3]) => {
        ctx.beginPath();
        ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.lineTo(x3,y3);
        ctx.closePath(); ctx.fill(); ctx.stroke();
    });

    // Center dot
    ctx.fillStyle = '#ff0000';
    ctx.beginPath();
    ctx.arc(0, 0, 3, 0, Math.PI*2);
    ctx.fill();

    // Labels
    ctx.fillStyle = '#00ddff';
    ctx.font      = 'bold 10px Courier New';
    ctx.fillText('LHPD', -55, 4);
    ctx.fillText('RHPD',  30, 4);

    ctx.restore();
}

/* ─── threat symbol ─── */
function drawThreatSymbol(threat) {
    const pos = polarToXY(threat.scanDirection, threat.range);
    ctx.save();
    ctx.translate(pos.x, pos.y);
    ctx.fillStyle   = '#fff';
    ctx.strokeStyle = '#fff';
    ctx.lineWidth   = 2;

    switch (radarState.threatType) {
        case 'search':
            ctx.strokeRect(-7,-7,14,14); break;
        case 'track':
            ctx.beginPath(); ctx.moveTo(0,-9); ctx.lineTo(-8,7); ctx.lineTo(8,7);
            ctx.closePath(); ctx.stroke(); ctx.fill(); break;
        case 'trackWhileScan':
            ctx.beginPath(); ctx.moveTo(0,-9); ctx.lineTo(9,0);
            ctx.lineTo(0,9); ctx.lineTo(-9,0); ctx.closePath(); ctx.stroke(); break;
        case 'acquisition':
            ctx.font = 'bold 20px Courier New'; ctx.fillText('✱',-7,7); break;
        case 'missile':
            ctx.beginPath(); ctx.arc(0,0,8,0,Math.PI*2); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(-8,0); ctx.lineTo(8,0);
            ctx.moveTo(0,-8); ctx.lineTo(0,8); ctx.stroke(); break;
        case 'unknown':
            ctx.font = 'bold 18px Courier New'; ctx.fillText('#',-6,6); break;
    }

    ctx.fillStyle = '#fff';
    ctx.font      = 'bold 10px Courier New';
    ctx.fillText('T'+threat.id, 12, -4);
    ctx.restore();
}

/* ─── hex to rgb ─── */
function hexRGB(hex) {
    return {
        r: parseInt(hex.slice(1,3), 16),
        g: parseInt(hex.slice(3,5), 16),
        b: parseInt(hex.slice(5,7), 16)
    };
}

/* ─── display update ─── */
function updateDisplay() {
    const names = {
        search:'SEARCH', track:'TRACK', trackWhileScan:'TRACK WHILE SCAN',
        acquisition:'ACQUISITION', missile:'MISSILE', unknown:'UNKNOWN'
    };
    document.getElementById('activeThreat').textContent      = names[radarState.threatType];
    document.getElementById('activeThreatsCount').textContent = radarState.numThreats;
    document.getElementById('activeMissilesCount').textContent =
        radarState.missiles.filter(m => m.active).length;
}

/* ══════════════════════════════════════
   EVENT LISTENERS
══════════════════════════════════════ */
document.getElementById('threatType').addEventListener('change', function() {
    radarState.threatType = this.value;
    initializeThreats(); createThreatsUI(); updateDisplay();
});

document.getElementById('numThreats').addEventListener('input', function() {
    radarState.numThreats = Math.max(1, Math.min(16, parseInt(this.value)));
    this.value = radarState.numThreats;
    initializeThreats(); createThreatsUI(); updateDisplay();
});

document.getElementById('sweepToggle').addEventListener('click', function() {
    radarState.sweepActive = !radarState.sweepActive;
    this.textContent = radarState.sweepActive ? 'STOP SWEEP' : 'START SWEEP';
});

document.getElementById('clearButton').addEventListener('click', function() {
    radarState.threatType  = 'search';
    radarState.numThreats  = 1;
    radarState.sweepActive = false;
    document.getElementById('threatType').value  = 'search';
    document.getElementById('numThreats').value  = 1;
    document.getElementById('sweepToggle').textContent = 'START SWEEP';
    initializeThreats(); createThreatsUI(); updateDisplay();
});

document.getElementById('numMissiles').addEventListener('input', function() {
    const n = Math.max(1, Math.min(8, parseInt(this.value)));
    this.value = n;
    initializeMissiles(n); createMissilesUI(); updateDisplay();
});

document.getElementById('clearMissilesBtn').addEventListener('click', function() {
    radarState.missiles.forEach((m, i) => {
        m.active = false; m.progress = 0; m.trail = [];
        setMissileStatus(i, 'idle');
        const btn = document.getElementById(`launchBtn-${i}`);
        if (btn) { btn.textContent = `🚀 LAUNCH MISSILE M${m.id}`; btn.classList.remove('launched'); }
    });
    updateDisplay();
});

/* ══════════════════════════════════════
   INIT & LOOP
══════════════════════════════════════ */
initializeThreats();
createThreatsUI();
initializeMissiles(1);
createMissilesUI();
updateDisplay();

function animate() {
    drawRadar();
    requestAnimationFrame(animate);
}
animate();
</script>
</body>
